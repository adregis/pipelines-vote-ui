apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: vote-app-prod-run
  annotations:
    # --- Dispara apenas para Tags de versão ---
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-cel-expression: "body.ref.startsWith('refs/tags/v')"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  taskRunTemplate:
    serviceAccountName: pipeline
  pipelineSpec:
    workspaces:
      - name: shared-workspace
    tasks:
      - name: fetch-repository
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: git-clone
            - name: namespace
              value: openshift-pipelines
        workspaces:
          - name: output
            workspace: shared-workspace
        params:
          - name: URL
            value: "{{ repo_url }}"
          - name: REVISION
            value: "{{ revision }}"

      - name: run-tests
        taskRef:
          name: run-unit-tests
        params:
          - name: CONTEXT_DIR
            value: "app"
        workspaces:
          - name: source
            workspace: shared-workspace
        runAfter:
          - fetch-repository

      - name: build-image
        taskRef:
          name: buildah-local
        params:
          - name: IMAGE
            value: "image-registry.openshift-image-registry.svc:5000/pipelines-tutorial/{{ repo_name }}:{{ revision }}"
          - name: CONTEXT_DIR
            value: "."
          - name: DOCKERFILE
            value: "Dockerfile"
        workspaces:
          - name: source
            workspace: shared-workspace
        runAfter:
          - run-tests

      # Atualiza a pasta k8s/prod no vote-app-config!
      - name: update-gitops-manifest
        taskRef:
          name: git-update-manifest
        params:
          - name: git-config-repo
            value: "https://github.com/adregis/vote-app-config.git"
          - name: environment
            value: "prod"
          - name: app-name
            value: "{{ repo_name }}"
          - name: image-tag
            value: "image-registry.openshift-image-registry.svc:5000/pipelines-tutorial/{{ repo_name }}:{{ revision }}"
        workspaces:
          - name: source
            workspace: shared-workspace
        runAfter:
          - build-image

  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi